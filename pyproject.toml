[project]
name = "jobpilot"
version = "0.1.0"
description = "JobPilot - AI job-search assistant (Naukri-style). GenAI capstone project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4.4",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.14",
    "pydantic>=2.14.0",
]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
